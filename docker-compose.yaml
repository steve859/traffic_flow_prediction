services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168

  schema-registry:
    image: confluentinc/cp-schema-registry:7.4.1
    container_name: schema-registry
    depends_on:
      - kafka
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
    ports:
      - "8081:8081"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    ports:
      - "8080:8080"

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: traffic
      POSTGRES_USER: traffic
      POSTGRES_PASSWORD: traffic
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: nguyenhongquan.work@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres

  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
    ports:
      - "8082:8080"
      - "7077:7077"
    volumes:
      - ./spark-apps:/opt/spark-apps
      - ./:/opt/project
      - ./data/spark-checkpoints:/opt/spark-checkpoints
    depends_on:
      - kafka

  spark-worker-1:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-worker-1
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    environment:
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
    depends_on:
      - spark-master
    volumes:
      - ./spark-apps:/opt/spark-apps
      - ./:/opt/project
      - ./data/spark-checkpoints:/opt/spark-checkpoints

  spark-predictor:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-predictor
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.postgresql:postgresql:42.7.3
      - /opt/spark-apps/stgcn_streaming_job.py
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: traffic_counts_raw
      KAFKA_STARTING_OFFSETS: earliest
      WINDOW_SECONDS: 60
      STGCN_INPUT_LEN: 4
      STGCN_HORIZON: 1
      PROJECT_DIR: /opt/project
      STGCN_MODEL_PATH: /opt/project/model/stgcn_hcm_final.pt
      ADJ_MATRIX_PATH: /opt/project/adj_matrix.npy
      SCALER_PARAMS_PATH: /opt/project/model/scaler_params.json
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/traffic
      POSTGRES_USER: traffic
      POSTGRES_PASSWORD: traffic
      POSTGRES_TABLE: traffic_predictions
      SPARK_CHECKPOINT_LOCATION: /opt/spark-checkpoints/stgcn
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./spark-apps:/opt/spark-apps
      - ./:/opt/project
      - ./data/spark-checkpoints:/opt/spark-checkpoints
    depends_on:
      - spark-master
      - kafka
      - postgres

  inference-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inference_api
    command: ["bash", "-c", "uvicorn app.inference:app --host 0.0.0.0 --port 5002 --workers 1"]
    environment:
      MODEL_DIR: /app/model
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_PRED_TOPIC: predictions
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./:/app
    ports:
      - "5002:5002"
    depends_on:
      - kafka

  producer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: camera_producer
    command: ["bash", "-c", "python -m app.producer.producer_main"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: traffic_counts_raw

      # Switch producer mode:
      # - csv (default): replay from COUNTS_CSV
      # - yolo: read images from DEMO_DATA_DIR and run YOLO counting
      PRODUCER_MODE: ${PRODUCER_MODE:-csv}

      COUNTS_CSV: /app/hcmc_flow.csv
      REPLAY_SPEEDUP: 60

      # YOLO folder demo config (used when PRODUCER_MODE=yolo)
      DEMO_DATA_DIR: /app/data_to_demo
      DEMO_GROUP_INTERVAL_SECONDS: 1
      DEMO_LOOP: "false"
      YOLO_MODEL_PATH: /app/vision/detector/yolov8n_multiclass_best.pt
      YOLO_CONF: 0.25
      YOLO_IMGSZ: 640
      YOLO_RESIZE_W: 640
      YOLO_RESIZE_H: 384
      YOLO_SAVE_ANNOTATED: "false"
      YOLO_ANNOTATED_DIR: /app/data/yolo_annotated
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./:/app
    depends_on:
      - kafka

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traffic_consumer
    command: ["bash", "-c", "python app/consumer/kafka_consumer.py"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: traffic_raw_data
      KAFKA_GROUP_ID: traffic_consumer
      KAFKA_AUTO_OFFSET_RESET: earliest
      AGGREGATE_WINDOW_SECONDS: 60
      OUTPUT_DIR: /app/data/consumer_output
      FORWARD_INFERENCE_URL: http://inference-api:5002/predict
      KAFKA_PRED_TOPIC: predictions
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./:/app
    depends_on:
      - kafka
      - inference-api

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traffic_dashboard
    command: ["bash", "-c", "streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0"]
    environment:
      DATA_DIR: /app/data
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "8501:8501"
    volumes:
      - ./:/app
    depends_on:
      inference-api:
        condition: service_started

volumes:
  redis-data:
  pg-data:
  pgadmin-data:
